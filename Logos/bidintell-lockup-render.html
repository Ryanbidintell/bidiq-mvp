<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
  /* Rendered on the slide's own background (#ECE0D6, theme accent2) so the PNG
     drops onto slide 1 with no visible box and no transparency handling. */
  html,body{margin:0;padding:0;background:#ECE0D6;}
  #logo{
    width:1800px;height:420px;background:#ECE0D6;
    display:flex;align-items:center;gap:56px;padding:0 8px;box-sizing:border-box;
  }
  .badge{
    width:340px;height:340px;border-radius:74px;background:#F26522;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .badge span{
    font-family:'Plus Jakarta Sans',Arial,sans-serif;font-weight:800;
    font-size:170px;color:#FFFFFF;letter-spacing:-2px;line-height:1;
  }
  .word{
    font-family:'Plus Jakarta Sans',Arial,sans-serif;font-weight:800;
    font-size:228px;color:#0B0F14;letter-spacing:-6px;line-height:1;
  }
</style>
</head>
<body>
  <div id="logo">
    <div class="badge"><span>BI</span></div>
    <div class="word">BidIntell</div>
  </div>
</body>
</html>
